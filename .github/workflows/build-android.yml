name: Build ScrollVoice AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Periksa berkas proyek Android
        run: |
          if [ ! -f android-app/gradlew ]; then
            echo "Gradle wrapper belum tersedia."
            exit 1
          fi
          if [ ! -f android-app/settings.gradle ] && [ ! -f android-app/settings.gradle.kts ]; then
            echo "Konfigurasi proyek Android belum lengkap."
            exit 1
          fi
          chmod +x android-app/gradlew

            - name: Siapkan keystore release
                    env:
                              RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
                                      run: |
                                                echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scrollvoice-release.jks"
                                                          test -s "$RUNNER_TEMP/scrollvoice-release.jks"

                                                                - name: Build APK release
                                                                        working-directory: android-app
                                                                                env:
                                                                                          RELEASE_STORE_FILE: ${{ runner.temp }}/scrollvoice-release.jks
                                                                                                    RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
                                                                                                              RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
                                                                                                                        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
                                                                                                                                run: ./gradlew assembleRelease

                                                                                                                                      - name: Simpan APK release
                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                      with:
                                                                                                                                                                name: ScrollVoice-AI-Release-APK
                                                                                                                                                                          path: android-app/app/build/outputs/apk/release/*.apk
                                                                                                                                                                                    if-no-files-found: error
            - name: Simpan APK release
                    uses: actions/upload-artifact@v4
                            with:
                                      name: ScrollVoice-AI-Release-APK
                                                path: android-app/app/build/outputs/apk/release/*.apk
                                                          if-no-files-found: error